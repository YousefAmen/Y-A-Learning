{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    .contact-page-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        background: #f9f9f9;
        padding: 20px;
        margin-top: 70px;
    }

    .contact-card {
        background: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 100%;
        text-align: center;
    }

    .contact-title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
    }

    .contact-subtitle {
        font-size: 15px;
        color: #777;
        margin-bottom: 25px;
    }

    .contact-form .form-group {
        text-align: left;
    }

    .btn-submit {
        display: inline-block;
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 8px;
        background: #1a3a75;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-submit:hover {
        background: #05193d;
        transform: translateY(-2px);
    }
</style>
<div class="contact-page-container">
    <div class="contact-card">
        <h2 class="contact-title">📩 Contact Us</h2>
        <p class="contact-subtitle">
            Have questions? Fill out the form below and we'll get back to you soon.
        </p>

        <form action="" method="POST" class="contact-form">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
