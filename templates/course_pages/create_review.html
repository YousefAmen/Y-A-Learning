{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    body {
        font-family: 'Inter', sans-serif;
    }

    /* Centered wrapper */
    .review-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 80px 20px;
    }

    /* Card */
    .review-card {
        width: 100%;
        max-width: 640px;
        border-radius: 20px;
        padding: 36px 40px;
        animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Header */
    .review-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .review-header h2 {
        font-size: 24px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 10px;
    }

    .review-header p {
        color: #6b7280;
        font-size: 15px;
        margin: 0;
    }

    /* Fake rating stars (optional) */
    .rating-stars {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 12px;
    }

    .rating-stars span {
        font-size: 22px;
        color: #fbbf24;
        /* amber */
    }

    /* Inputs */
    .review-form input,
    .review-form textarea,
    .review-form select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 15px;
        background: #f9fafb;
        transition: all 0.25s ease;
    }

    .review-form textarea {
        min-height: 120px;
        resize: vertical;
    }

    .review-form input:focus,
    .review-form textarea:focus,
    .review-form select:focus {
        border-color: #2563eb;
        background: #fff;
        outline: none;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    /* Button */
    .review-btn {
        width: 100%;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: #fff;
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .review-btn:hover {
        background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
    }

    .review-btn:active {
        transform: translateY(0);
        box-shadow: none;
    }
</style>

<div class="review-wrapper">
    <div class="review-card">
        <div class="review-header">
            <div class="rating-stars">
                <span>★</span><span>★</span><span>★</span><span>★</span><span>☆</span>
            </div>
            <h2>Write a Review</h2>
            <p>Share your experience and help others decide</p>
        </div>

        <form method="POST" class="review-form">
            {% csrf_token %}
            {{ form|crispy }}
            <br>
            <br>
            <br>
            <button type="submit" class="review-btn">💬 Submit Review</button>
        </form>
    </div>
</div>
{% endblock %}
