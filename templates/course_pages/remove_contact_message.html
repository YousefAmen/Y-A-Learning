{% extends 'base.html' %}

{% block content %}
<style>
    .delete-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        background: #f9f9f9;
        padding: 20px;
        margin-top: 70px;
    }

    .delete-card {
        background: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        max-width: 600px;
        width: 100%;
        text-align: center;
    }

    .delete-title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #d32f2f;
    }

    .delete-subtitle {
        font-size: 15px;
        color: #555;
        margin-bottom: 20px;
    }

    .delete-message-box {
        background: #fafafa;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: left;
    }

    .delete-warning {
        color: #d32f2f;
        font-size: 14px;
        margin-top: 10px;
    }

    .delete-form {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 15px;
    }

    .btn-delete {
        background: #d32f2f;
        color: #fff;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .btn-delete:hover {
        background: #b71c1c;
    }

    .btn-cancel {
        background: #e0e0e0;
        color: #333;
        padding: 10px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .btn-cancel:hover {
        background: #bdbdbd;
    }
</style>
<div class="delete-container">
    <div class="delete-card">
        <h2 class="delete-title">🗑️ Delete Contact Message</h2>
        <p class="delete-subtitle">
            Are you sure you want to permanently delete this message?
        </p>

        <div class="delete-message-box">
            <p><strong>Message:</strong> {{ message.message }}</p>
            <p class="delete-warning">⚠️ This action cannot be undone.</p>
        </div>

        <form method="post" class="delete-form">
            {% csrf_token %}
            <button type="submit" class="btn-delete">Yes, Delete</button>
            <a href="{% url 'course:user-contact-messages' %}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
