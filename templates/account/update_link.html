{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    .update-container {
        margin-top: 100px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
    }

    .update-card {
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .update-title {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
        font-weight: bold;
    }

    .form-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .btn-cancel {
        background: #6c757d;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn-cancel:hover {
        background: #5a6268;
    }

    .btn-update {
        background: #007bff;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-update:hover {
        background: #0056b3;
    }
</style>

<div class="update-container">
    <div class="update-card">
        <h2 class="update-title">Update Social Link</h2>

        <form action="" method="POST">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="form-actions">
                <a href="{% url 'members:user_profile' request.user.slug request.user.token %}"
                    class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-update">Update Link</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
